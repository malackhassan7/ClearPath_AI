name: clearpath-ai

# Usage (from this folder):
#   cp .env.example .env        # then edit secrets
#   docker compose up --build
# API: http://localhost:8000/docs   Health: http://localhost:8000/health

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: clearpathai_tn
      POSTGRES_USER: clearpathai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearpathai -d clearpathai_tn"]
      interval: 5s
      timeout: 5s
      retries: 20

  test-db:
    profiles: ["test"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: clearpathai_test
      POSTGRES_USER: clearpathai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearpathai -d clearpathai_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      args:
        INSTALL_ML: ${INSTALL_ML:-0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Container-network values; these override the localhost URLs in .env
      DATABASE_URL: postgresql+asyncpg://clearpathai:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/clearpathai_tn
      SYNC_DATABASE_URL: postgresql://clearpathai:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/clearpathai_tn
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173","http://127.0.0.1:5173"]'
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
